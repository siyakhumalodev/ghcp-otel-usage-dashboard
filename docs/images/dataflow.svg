<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title description">
  <title id="title">GitHub Copilot telemetry runtime dataflow</title>
  <desc id="description">GitHub Copilot in VS Code sends OTLP traces and metrics to an OpenTelemetry Collector. Processed telemetry goes through the Azure Monitor exporter to Application Insights and Log Analytics. Trace debug output also enters Log Analytics through Container Apps logs. Azure Managed Grafana queries the workspace. Managed identity provides access to Azure Container Registry and Key Vault through a private endpoint.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0078D4" /></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#D83B01" /></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#42526E" stroke-width="1.5" /></marker>
    <style>
      .title { font: 700 24px "Segoe UI", sans-serif; fill: #172b4d; }
      .boundary-title { font: 700 15px "Segoe UI", sans-serif; fill: #172b4d; }
      .vnet-title { font: 700 14px "Segoe UI", sans-serif; fill: #164e52; }
      .subnet-title { font: 700 13px "Segoe UI", sans-serif; fill: #172b4d; }
      .node-title { font: 700 13px "Segoe UI", sans-serif; fill: #172b4d; text-anchor: middle; }
      .node-subtitle { font: 400 12px "Segoe UI", sans-serif; fill: #42526e; text-anchor: middle; }
      .external { font: 600 15px "Segoe UI", sans-serif; fill: #172b4d; text-anchor: middle; }
      .edge-label { font: 400 11px "Segoe UI", sans-serif; fill: #172b4d; text-anchor: middle; }
      .dependency-label { font: 400 11px "Segoe UI", sans-serif; fill: #42526e; text-anchor: middle; }
      .legend { font: 400 12px "Segoe UI", sans-serif; fill: #42526e; }
      .runtime { fill: none; stroke: #0078d4; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .runtime-both { fill: none; stroke: #0078d4; stroke-width: 2.5; marker-start: url(#arrow-blue); marker-end: url(#arrow-blue); }
      .debug { fill: none; stroke: #d83b01; stroke-width: 2.5; marker-end: url(#arrow-orange); }
      .dependency { fill: none; stroke: #42526e; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow-gray); }
      .label-bg { fill: #ffffff; }
    </style>
  </defs>
